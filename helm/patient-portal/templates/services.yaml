# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patient-portal.backend.fullname" . }}
  labels:
    {{- include "patient-portal.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "patient-portal.selectorLabels" . | nindent 4 }}
    component: backend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.backend.containerPort }}
      protocol: TCP
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patient-portal.frontend.fullname" . }}
  labels:
    {{- include "patient-portal.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "patient-portal.selectorLabels" . | nindent 4 }}
    component: frontend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}
      protocol: TCP
