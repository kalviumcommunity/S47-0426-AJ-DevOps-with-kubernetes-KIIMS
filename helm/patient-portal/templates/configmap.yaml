apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.name }}
  labels:
    {{- include "patient-portal.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  BACKEND_URL: "http://{{ include "patient-portal.backend.fullname" . }}:{{ .Values.service.port }}"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PORT: {{ .Values.backend.containerPort | quote }}
  SIMPLE_REGISTRAR: {{ .Values.config.simpleRegistrar | quote }}
