apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-portal-frontend
  namespace: default
  labels:
    app: patient-portal-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: patient-portal-frontend
  template:
    metadata:
      labels:
        app: patient-portal-frontend
    spec:
      containers:
        - name: patient-portal-frontend
          image: ghcr.io/kalviumcommunity/patient-portal-frontend:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: patient-portal-config
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3