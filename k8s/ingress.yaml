apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patient-portal
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: patient-portal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: patient-portal-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: patient-portal-backend
                port:
                  number: 80
  tls:
    - hosts:
        - patient-portal.local
      secretName: patient-portal-tls