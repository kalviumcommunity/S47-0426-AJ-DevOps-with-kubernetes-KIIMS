apiVersion: v1
kind: Service
metadata:
  name: sprint3-app
  namespace: default
  labels:
    app: sprint3-app
spec:
  # ClusterIP exposes the service only within the cluster.
  # Change to LoadBalancer or add an Ingress resource to expose externally.
  type: ClusterIP
  selector:
    app: sprint3-app
  ports:
    - name: http
      protocol: TCP
      port: 80          # port the Service listens on inside the cluster
      targetPort: 8080  # port the container listens on
