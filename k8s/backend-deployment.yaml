apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-portal-backend
  namespace: default
  labels:
    app: patient-portal-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: patient-portal-backend
  template:
    metadata:
      labels:
        app: patient-portal-backend
    spec:
      containers:
        - name: patient-portal-backend
          image: ghcr.io/kalviumcommunity/patient-portal-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: patient-portal-config
            - secretRef:
                name: patient-portal-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3