name: CI/CD Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# Trigger conditions
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ─────────────────────────────────────────────────────────────────────────────
# Environment variables shared across all jobs
# ─────────────────────────────────────────────────────────────────────────────
env:
  IMAGE_NAME: sprint3-app
  REGISTRY: ghcr.io/${{ github.repository_owner }}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — LINT
# Validates code style and catches obvious errors before any build work.
# Fails fast: if linting fails, the build and deploy stages never run.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: "Stage 1 — Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies and linting tools
        run: pip install -r requirements.txt flake8 pylint

      - name: Run flake8 (style + syntax check)
        # --max-line-length 120 matches the project's agreed line length
        # --count prints total error count at the end for quick scanning
        run: flake8 app/ --max-line-length=120 --count --statistics --show-source

      - name: Run pylint (deeper static analysis)
        run: pylint app/ --fail-under=7.0

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 2 — TEST
  # Runs the unit test suite. Depends on lint passing — no point running tests
  # if the code doesn't even pass basic style checks.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "Stage 2 — Test"
    runs-on: ubuntu-latest
    needs: lint                   # ← only runs if lint passes

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        # --tb=short gives concise tracebacks on failure
        # --cov-fail-under=80 enforces a minimum 80% coverage threshold
        run: pytest tests/ --tb=short --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=80

      - name: Upload coverage report as artifact
        # Always upload so the report is available even when tests fail —
        # this gives developers the coverage diff without re-running locally.
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 3 — BUILD & PUSH IMAGE
  # Builds the Docker image and pushes it to the container registry.
  # Only runs on pushes to main (not on PRs) to avoid publishing unreviewed code.
  # The image is tagged with both the commit SHA (immutable) and 'latest'.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Stage 3 — Build & Push Image"
    runs-on: ubuntu-latest
    needs: test                   # ← only runs if tests pass

    # Only build and push on merges to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      # Expose the image tag so the deploy job can reference the exact image
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        # Buildx enables multi-platform builds and layer caching
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with the short commit SHA for traceability (e.g. sha-9f3a1c2)
            type=sha,prefix=sha-,format=short
            # Also tag as 'latest' for convenience
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers from the registry to speed up subsequent builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 4 — DEPLOY TO KUBERNETES
  # Updates the Kubernetes Deployment manifest with the new image tag and applies
  # it to the cluster. Monitors the rollout and triggers an automatic rollback
  # if the new pods do not become healthy within the timeout window.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Stage 4 — Deploy to Kubernetes"
    runs-on: ubuntu-latest
    needs: build                  # ← only runs if image build succeeds
    environment: production       # requires manual approval gate (configured in repo settings)

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.34.1"

      - name: Configure kubectl credentials
        # KUBE_CONFIG is a base64-encoded kubeconfig stored as a GitHub secret
        run: |
          mkdir -p $HOME/.kube
          printf "%s" "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Substitute image tag in Kubernetes manifests
        # Replace the placeholder IMAGE_TAG in the manifests with the actual
        # commit-SHA tag produced by the build stage.
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" k8s/backend-deployment.yaml
          sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" k8s/frontend-deployment.yaml
          echo "Deploying image tag: ${IMAGE_TAG}"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/services.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml

      - name: Wait for rollout to complete
        # Monitors both backend and frontend deployments for successful rollout.
        run: |
          kubectl rollout status deployment/patient-portal-backend --timeout=120s
          kubectl rollout status deployment/patient-portal-frontend --timeout=120s

      - name: Automatic rollback on failure
        # This step only runs if any of the previous deployment steps failed.
        if: failure()
        run: |
          echo "Rollout failed — initiating automatic rollback"
          kubectl rollout undo deployment/patient-portal-backend || true
          kubectl rollout undo deployment/patient-portal-frontend || true
          echo "Rollback complete. Check logs for details."

      - name: Notify on deployment failure
        # Posts a summary to the GitHub Actions step summary on failure.
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Automatic rollback has been triggered if applicable. Check the logs for details." >> $GITHUB_STEP_SUMMARY

      - name: Notify on deployment success
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`${{ needs.build.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
